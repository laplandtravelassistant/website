<link rel="preload" href="fonts/dm-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are hosted with the site (no Google Fonts connection) */
@font-face{font-family:Fraunces;font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/fraunces.woff2) format('woff2')}
@font-face{font-family:Fraunces;font-style:italic;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-italic.woff2) format('woff2')}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-sans-400.woff2) format('woff2')}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-sans-500.woff2) format('woff2')}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/dm-sans-700.woff2) format('woff2')}
@font-face{font-family:Cinzel;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cinzel-600.woff2) format('woff2')}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.btn.busy{opacity:.6;pointer-events:none}
@media (max-width:600px){ body.in-builder .top .logo > span{display:none} body.in-builder .top .wrap{gap:12px} body.in-builder #topright .link{white-space:nowrap;font-size:14px} }
.sm-only{display:none}
/* odd number of categories: the "Ready to pick" card fills the empty slot instead of its own row */
@media (min-width:621px){ .cats > .cta-card.fill{grid-column:auto;flex-direction:column;align-items:flex-start;justify-content:center;padding:30px} }
@media (max-width:420px){ .lg-only{display:none} .sm-only{display:inline} }
.err a{color:inherit}
:root{
  --bg:#F6F8F8; --surface:#FFFFFF; --ink:#0E2A3B; --muted:#4A5A64; --line:#D9E0E3;
  --panel:#0E2A3B; --panel-ink:#FFFFFF; --panel-muted:#C9D6DD; --gold:#C9A24A; --gold-ink:#8A6A1F; --gold-soft:#F4EEDF; --ph:#DCE4E8; --ph-ink:#4A5A64;
  --serif:Fraunces, Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --logo:Cinzel, Georgia, serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1C26; --surface:#12293A; --ink:#EEF3F5; --muted:#A9BAC4; --line:#25414F;
    --panel:#16364A; --ph:#1B3647; --ph-ink:#A9BAC4; --gold-ink:#D9B55E; --gold-soft:#1E3240;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1C26; --surface:#12293A; --ink:#EEF3F5; --muted:#A9BAC4; --line:#25414F;
  --panel:#16364A; --ph:#1B3647; --ph-ink:#A9BAC4; --gold-ink:#D9B55E; --gold-soft:#1E3240;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 32px}
@media (max-width:640px){.wrap{padding:0 20px}}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0;background:none;border:0;padding:0;cursor:pointer}
.logo .w1{font-family:var(--logo);font-weight:600;font-size:21px;letter-spacing:.1em;line-height:1;display:block}
.logo .w2{font-family:var(--logo);font-weight:600;font-size:8.5px;letter-spacing:.34em;line-height:1;display:block;margin-top:5px}
.nav{display:flex;gap:28px}
.nav button{background:none;border:0;padding:8px 0;cursor:pointer;font-weight:500;font-size:15px}
.nav button:hover{text-decoration:underline;text-underline-offset:4px}
@media (max-width:900px){.nav{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0E2A3B}
.btn.small{min-height:44px;padding:8px 18px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:10px 0;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-decoration:underline;text-underline-offset:4px}

/* photo placeholder */
.ph{background:var(--ph);border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:14px}
.ph span{font-size:12px;color:var(--ph-ink);position:relative}
.ph svg{position:absolute;right:14px;top:14px;opacity:.35}
.ph.photo{padding:0}
.ph.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.banner{height:260px;border-radius:24px;margin-top:18px}
@media (max-width:640px){.banner{height:180px}}

/* hero */
.hero{padding:64px 0 48px}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(42px,5.4vw,70px);letter-spacing:-.01em}
.hero p{font-size:20px;color:var(--muted);max-width:44ch;margin-top:22px}
h1[tabindex="-1"]:focus{outline:none}
.hero p.hero-sub{font-size:17px;margin-top:12px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.scene{background:var(--panel);border-radius:28px;aspect-ratio:5/4;position:relative;overflow:hidden}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.scene .cap{position:absolute;left:20px;bottom:18px;font-size:12px;color:var(--panel-muted)}
@media (max-width:900px){.hero .grid{grid-template-columns:1fr;gap:32px}.hero{padding-top:36px}}

.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between}
.trust div{display:flex;align-items:center;gap:10px;font-size:15px}

section.block{padding:88px 0 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:32px}
.sec-head h2{font-size:clamp(32px,3.6vw,46px)}
.sec-head p{color:var(--muted);margin-top:10px;max-width:52ch}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
@media (max-width:980px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.cats{grid-template-columns:1fr}}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;text-align:left;cursor:pointer;padding:0;color:var(--ink)}
.cat:hover{border-color:var(--ink)}
.cat .ph{border-radius:0;height:190px}
.cat .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:6px}
.cat h3{font-size:24px}
.cat .d{color:var(--muted);font-size:15px;line-height:1.5}
.cat .n{font-size:14px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:8px}
.cat .badge{position:absolute;top:14px;left:14px;background:var(--gold);color:#0E2A3B;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
.cat .cnt{position:absolute;top:14px;right:14px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
.cats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:620px){.cats.two{grid-template-columns:1fr}}
.cta-card{background:var(--panel);color:var(--panel-ink);border-radius:22px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.cta-card p{color:var(--panel-muted)}

/* how */
.how{background:var(--panel);color:var(--panel-ink);border-radius:30px;padding:64px}
.how h2{font-size:clamp(32px,3.6vw,46px)}
.how ol{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
.how li{display:flex;flex-direction:column;gap:12px}
.how .num{width:46px;height:46px;border-radius:999px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:19px}
.how h3{font-size:23px}
.how p{color:var(--panel-muted);font-size:16px}
@media (max-width:860px){.how{padding:36px 24px}.how ol{grid-template-columns:1fr;gap:28px}}

.split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.split h2{font-size:clamp(32px,3.6vw,46px)}
.split p{color:var(--muted);margin:18px 0 26px;max-width:46ch}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:28px}}

footer.site{background:var(--panel);color:var(--panel-ink);margin-top:96px;padding:56px 0 64px}
footer.site .wrap{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
footer.site .col{display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--panel-muted)}
footer.site .col b{color:var(--panel-ink)}
@media (max-width:760px){footer.site .wrap{grid-template-columns:1fr}}

/* builder */
.steps{display:flex;align-items:center;gap:12px}
.steps .s{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.steps .dot{width:26px;height:26px;border-radius:999px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface)}
.steps .s.on{color:var(--ink);font-weight:700}
.steps .s.on .dot,.steps .s.done .dot{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.steps .bar{width:36px;height:1.5px;background:var(--line)}
.steps .bar.done{background:var(--ink)}
@media (max-width:720px){.steps .s .t{display:none}.steps .s.on .t{display:inline}.steps .bar{width:16px}}

.builder{padding-top:48px;padding-bottom:140px}
.b-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;align-items:start}
@media (max-width:1020px){.b-grid{grid-template-columns:1fr}}
.b-title h1{font-size:clamp(34px,4vw,48px)}
.b-title p{color:var(--muted);margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px}
@media (max-width:640px){.card{padding:22px}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fields .full{grid-column:1/-1}
@media (max-width:620px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);font-size:16px;min-height:50px}
.field textarea{resize:vertical;min-height:120px}
.field .hint{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;min-height:50px;justify-content:space-between;padding:0 6px;background:var(--surface)}
.stepper button{width:44px;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;font-size:22px;line-height:1}
.stepper button:hover{background:var(--bg)}
.stepper output{font-weight:700}
.err{color:#B3261E;font-size:14px;font-weight:500;min-height:1em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#FFB4AB}}
:root[data-theme="dark"] .err{color:#FFB4AB}
.check{display:flex;align-items:flex-start;gap:12px;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--ink)}
.row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:16px;flex-wrap:wrap}

/* activity list */
.acts{display:flex;flex-direction:column;gap:16px;margin-top:28px}
.act{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:22px;align-items:center}
.act.added{border-color:var(--ink)}
.act .ph{height:124px;border-radius:14px}
.act h3{font-size:22px}
.act p{color:var(--muted);font-size:15px;line-height:1.5;margin-top:6px}
.act .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:10px}
.act .meta span{display:flex;align-items:center;gap:6px}
.act .meta span.pr{display:block;flex-basis:100%;color:var(--muted)}
.act .go{padding-right:6px}
@media (max-width:720px){.act{grid-template-columns:1fr;gap:14px}.act .ph{height:160px}.act .go{padding:0}.act .go .btn{width:100%}}

.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.more summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"+";font-size:18px;line-height:1}
.more[open] summary::after{content:"\2212"}
.more .desc p{color:var(--ink);font-size:15.5px;line-height:1.65;margin-top:12px}
.more .facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:14px}
.more .facts b{font-weight:700}
.more .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.more h4{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.more ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--ink)}
.more li{margin:4px 0}
.more .know{margin-top:18px;background:var(--bg);border-radius:14px;padding:16px 18px}
@media (max-width:620px){.more .cols{grid-template-columns:1fr}}
.act.rich{align-items:start}
.act > .more{grid-column:2 / -1;margin-top:0}
@media (max-width:720px){.act > .more{grid-column:1 / -1}}
.price{color:var(--ink)}

/* gold accents */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:14px}
.eyebrow svg{flex-shrink:0}
.how .eyebrow,.panel-eyebrow{color:var(--gold)}
.hero h1 em{font-style:italic;color:var(--gold-ink);font-weight:500}
.trust{border-top:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-bottom:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}
.trust svg{color:var(--gold)}
.cat .n{color:var(--gold-ink)}
.cat:hover{border-color:var(--gold)!important;box-shadow:0 10px 30px -18px rgba(201,162,74,.6)}
.cat{transition:border-color .15s ease,box-shadow .15s ease}
.how .num{background:var(--gold);color:#0E2A3B;border-color:var(--gold)!important}
.band{background:var(--gold-soft);border-radius:30px;padding:56px}
@media (max-width:860px){.band{padding:32px 22px}}
footer.site{border-top:3px solid var(--gold)}
footer.site .col b{color:var(--gold)!important}
.act.added{border-color:var(--gold)!important}
.btn.ghost[aria-pressed="true"]{border-color:var(--gold);color:var(--ink)}
.btn.ghost[aria-pressed="true"] svg{color:var(--gold-ink)}
.steps .s.on .dot{background:var(--gold)!important;border-color:var(--gold)!important;color:#0E2A3B!important}
.b-title h1::before,.sec-star::before{content:"";display:block;width:34px;height:3px;border-radius:3px;background:var(--gold);margin-bottom:16px}
.more summary{color:var(--gold-ink)}
.tray h2::after{content:"";display:inline-block;width:8px;height:8px;margin-left:8px;background:var(--gold);transform:rotate(45deg) translateY(-3px);border-radius:1px}

.cats > .cta-card{grid-column:1/-1;flex-direction:row;align-items:center;gap:28px;padding:30px 36px}
.cats > .cta-card > div:nth-child(2){flex:1}
@media (max-width:620px){.cats > .cta-card{flex-direction:column;align-items:flex-start;padding:26px}}

/* scroll reveal: small expansion as boxes come into view */
.rv{opacity:0;transform:scale(.96) translateY(10px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

/* elevated */
.elev-mark{display:inline-flex;flex-direction:column;align-items:center;gap:0;color:var(--gold);text-align:center}
.elev-mark svg{width:26px;height:26px;margin-bottom:10px}
.elev-mark .em-l{font-family:var(--logo);font-weight:600;letter-spacing:.14em;font-size:34px;line-height:1;color:#F6F8F8}
.elev-mark .em-t{font-family:var(--logo);font-weight:600;letter-spacing:.42em;font-size:11px;margin-top:8px;color:#C9D6DD;padding-left:.42em}
.elev-mark .em-e{font-family:var(--logo);font-weight:600;letter-spacing:.5em;font-size:15px;margin-top:16px;padding:8px 0 0 .5em;border-top:1px solid var(--gold);color:var(--gold)}
.elev-mark.sm .em-l{font-size:20px}.elev-mark.sm .em-t{font-size:8px}.elev-mark.sm .em-e{font-size:11px;margin-top:10px}.elev-mark.sm svg{width:18px;height:18px;margin-bottom:6px}
.elev-mark.lg .em-l{font-size:44px}.elev-mark.lg .em-t{font-size:13px}.elev-mark.lg .em-e{font-size:18px}
.elev-panel{background:#0E2A3B;color:#F6F8F8;border-radius:30px;display:grid;grid-template-columns:1fr 1.2fr;overflow:hidden;border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.elev-left{display:flex;align-items:center;justify-content:center;padding:64px 32px;background:#0B2231;border-right:1px solid rgba(201,162,74,.25)}
.elev-right{padding:56px 52px}
.elev-right h2{font-size:clamp(30px,3.4vw,42px);color:#F6F8F8}
.elev-right p{color:#C9D6DD;margin-top:14px;max-width:46ch}
.elev-right .eyebrow{color:var(--gold)}
.btn.on-dark{color:#F6F8F8;border-color:rgba(246,248,248,.5);font-weight:500}
@media (max-width:860px){.elev-panel{grid-template-columns:1fr}.elev-left{border-right:0;border-bottom:1px solid rgba(201,162,74,.25);padding:44px 24px}.elev-right{padding:32px 24px}}
.elev-hero{background:#0E2A3B;color:#F6F8F8;text-align:center;padding:64px 0 56px}
.elev-hero h1{font-size:clamp(32px,4.2vw,50px);margin-top:28px;color:#F6F8F8}
.elev-hero p{color:#C9D6DD;max-width:56ch;margin:14px auto 0}
.field select{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);font-size:16px;min-height:50px}
/* packages */
.pkgs{margin-top:28px}
.pkgs h2{font-size:clamp(28px,3vw,36px)}
.pkgs > p{color:var(--muted);margin-top:8px;max-width:60ch}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
@media (max-width:620px){.pkg-grid{grid-template-columns:1fr}}
.pkg{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px}
.pkg.added{border-color:var(--gold)}
.pkg .tier{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.pkg h3{font-size:23px}
.pkg p{color:var(--muted);font-size:15px;line-height:1.5}
.pkg .pkg-price{color:var(--ink);margin-top:auto;padding-top:6px}
.pkg-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pkg.elevated{background:#0E2A3B;border-color:var(--gold);align-items:flex-start}
.pkg.elevated h3{color:#F6F8F8;margin-top:10px}.pkg.elevated p{color:#C9D6DD}
.pkg.elevated .elev-mark{align-items:flex-start;text-align:left}
.pkg-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.pkg-grid.four{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.pkg-grid.four{grid-template-columns:1fr}}
#packages .pkgs{margin-top:0}
.or-pick{font-size:24px;margin-top:40px}
/* packages page + flipbook */
.pk-h1{font-size:clamp(38px,4.6vw,56px)}
.pk-lead{color:var(--muted);max-width:62ch;margin-top:12px}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin-top:40px}
@media (max-width:1000px){.shelf{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.shelf{grid-template-columns:1fr}}
.shelf-item{display:flex;flex-direction:column;gap:12px}
.shelf-item p{color:var(--muted);font-size:15px;line-height:1.5}
.mini-book{aspect-ratio:3/4;border:0;cursor:pointer;border-radius:6px 16px 16px 6px;background:linear-gradient(90deg,#E9E1CF 0,#F7F2E7 6%,#FBF8F1 100%);box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.25),0 18px 30px -18px rgba(14,42,59,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;color:#0E2A3B;border-left:4px solid #C9A24A;transition:transform .25s ease,box-shadow .25s ease}
.mini-book:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:inset 6px 0 10px -6px rgba(0,0,0,.25),0 26px 40px -18px rgba(14,42,59,.6)}
.mini-book .mb-star{color:#C9A24A}.mini-book .mb-star svg{width:22px;height:22px}
.mini-book .mb-tier{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8A6A1F}
.mini-book .mb-name{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15}
.mini-book .mb-brand{font-family:var(--logo);font-size:9px;letter-spacing:.24em;margin-top:8px;color:#4A5A64}
.mini-book.elevated{background:linear-gradient(90deg,#08202E 0,#0E2A3B 8%,#12344A 100%);color:#F6F8F8}
.mini-book.elevated .mb-tier{color:#C9A24A}.mini-book.elevated .mb-brand{color:#C9D6DD}
.shelf-item .chosen{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--gold-ink)}
.pkg-banner{display:flex;align-items:center;gap:12px;margin-top:22px;padding:16px 20px;border:1.5px solid color-mix(in srgb,var(--gold) 60%,var(--line));background:var(--gold-soft);border-radius:16px;text-decoration:none;color:var(--ink)}
.pkg-banner svg:first-child{color:var(--gold)}
.pkg-banner span{flex:1;font-size:15px}
.flip{display:none;position:fixed;inset:0;z-index:60;background:rgba(5,15,22,.82);align-items:center;justify-content:center;padding:16px}
.flip.open{display:flex}
.flip-in{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:14px;color:#F6F8F8}
.fb-top{display:flex;justify-content:space-between;align-items:center}
.fb-top .eyebrow{color:var(--gold)}
.fb-stage{display:flex;justify-content:center;perspective:2400px}
.book{--w:min(420px,44vw);--h:calc(var(--w) * 1.36);position:relative;width:calc(var(--w) * 2);height:var(--h);transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.book.closed-front{transform:translateX(calc(var(--w) * -.5))}
.book.closed-back{transform:translateX(calc(var(--w) * .5))}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#FBF8F1;color:#0E2A3B;overflow:hidden;border-radius:0 10px 10px 0;box-shadow:inset 14px 0 18px -14px rgba(0,0,0,.28)}
.face.back{transform:rotateY(180deg);border-radius:10px 0 0 10px;box-shadow:inset -14px 0 18px -14px rgba(0,0,0,.28)}
.fb-cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:9%;background:linear-gradient(160deg,#FBF8F1,#F1E9D6);border-left:5px solid #C9A24A}
.book.elevated .fb-cover{background:#0E2A3B;color:#F6F8F8}
.fb-cover .fb-brand{font-family:var(--logo);font-weight:600;letter-spacing:.14em;font-size:clamp(14px,2vw,22px);display:flex;flex-direction:column;align-items:center}
.fb-cover .fb-brand small{font-size:.38em;letter-spacing:.4em;margin-top:6px}
.fb-cover .fb-tier{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8A6A1F;border-top:1px solid #C9A24A;padding-top:12px;margin-top:6px}
.book.elevated .fb-tier{color:#C9A24A}
.fb-cover h3{font-size:clamp(20px,2.8vw,34px)}
.fb-cover p{font-size:clamp(11px,1.3vw,14px);color:#4A5A64;max-width:28ch}
.book.elevated .fb-cover p{color:#C9D6DD}
.fb-cover .fb-hint{font-size:12px;color:#8A6A1F;margin-top:10px}
.fb-cover.back{border-left:0;border-right:5px solid #C9A24A}
.fb-in{height:100%;padding:8% 9% 12%;position:relative;display:flex;flex-direction:column;gap:3%}
.book.elevated .face:not(:has(.fb-cover)){background:#F7F4EC}
.fb-eye{font-size:clamp(9px,1vw,11px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#8A6A1F}
.fb-in h4{font-family:var(--serif);font-weight:600;font-size:clamp(14px,2vw,22px);line-height:1.15}
.fb-photo{flex:0 0 36%;border:1.5px dashed #D8CBAA;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(201,162,74,.07)}
.fb-photo span{font-size:11px;color:#8A7A58}
.fb-lines{display:flex;flex-direction:column;gap:7px}
.fb-lines i{display:block;height:7px;border-radius:4px;background:#E8E0CC}
.fb-days{display:grid;gap:10px}
.fb-days > div,.fb-sched > div{display:grid;gap:6px;padding-bottom:8px;border-bottom:1px solid #EDE5D2}
.fb-days b,.fb-sched b{font-size:12px;color:#0E2A3B}
.fb-sched{display:grid;gap:10px}
.fb-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.fb-list li{display:flex;align-items:center;gap:10px}
.fb-list li::before{content:"";width:8px;height:8px;border-radius:2px;background:#C9A24A;transform:rotate(45deg);flex-shrink:0}
.fb-list .fb-lines{flex:1}
.fb-choose{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.fb-choose span{font-size:12px;color:#4A5A64}
.fb-foot{position:absolute;left:9%;right:9%;bottom:4%;display:flex;justify-content:space-between;font-size:10px;color:#8A7A58;border-top:1px solid #EDE5D2;padding-top:6px}
.fb-ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.fb-ctrl span{min-width:110px;text-align:center;font-size:14px;color:#C9D6DD}
.fb-ctrl .btn.ghost{color:#F6F8F8;border-color:rgba(246,248,248,.5)}
.flip .x{background:transparent;color:#F6F8F8;border-color:rgba(246,248,248,.4)}
@media (max-width:640px){.book{--w:44vw}.fb-in{padding:7% 7% 14%}.fb-foot{font-size:8px}}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition:none}}

/* modal */
.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(5,15,22,.6);align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-in{background:var(--bg);border-radius:24px;padding:30px;width:100%;max-width:620px;max-height:90vh;overflow:auto;position:relative}
.modal-in h2{font-size:28px}
.modal-x{position:absolute;top:16px;right:16px}
.modal textarea{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);font-size:16px;min-height:110px;width:100%}
.flip-ph{margin-top:18px;border:1.5px dashed color-mix(in srgb,var(--gold) 60%,var(--line));border-radius:18px;aspect-ratio:3/2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;background:var(--gold-soft)}
.flip-ph span{color:var(--muted);font-size:14px;max-width:36ch}
/* estimate */
.est{font-size:14px;color:var(--muted)}
.tray li .est b{color:var(--ink);display:inline;font-size:15px}
small.warn{color:#9A5B00!important}
.total{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.total > div{display:flex;justify-content:space-between;align-items:baseline}
.total span{font-weight:700}
.total b{font-family:var(--serif);font-size:26px}
.total small{color:var(--muted);font-size:12.5px;line-height:1.45}
.ages{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 6px}
.ages label{display:flex;align-items:center;gap:8px;font-size:14px}
.ages select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:15px}

/* team */
.about-kit{margin:6px 0 8px;max-width:62ch;gap:12px}
.about-kit li{font-size:16.5px;line-height:1.6}
.about-page .about-text{max-width:62ch}
.about-page .team{margin:8px 0 32px}
.about-text{margin-top:18px;max-width:56ch}
.about-text p{color:var(--ink)!important;margin:0 0 14px!important;font-size:17px;line-height:1.7}
#about .split{align-items:start}
.team{display:grid;gap:18px}
.person{display:flex;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 26px}
.person img{width:112px;height:112px;border-radius:999px;object-fit:cover;flex-shrink:0;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.person h3{font-size:26px}
.person .role{color:var(--gold-ink)!important;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 0!important}
.person .bio{color:var(--muted);font-size:15px;margin:10px 0 0!important;max-width:40ch}
@media (max-width:520px){.person{flex-direction:column;align-items:flex-start}}

/* legal + footer links */
footer.site a{color:var(--panel-muted);text-decoration:none}
footer.site a:hover,.flink:hover{text-decoration:underline;text-underline-offset:4px}
.flink{background:none;border:0;padding:0;color:var(--panel-muted);font-size:15px;text-align:left;cursor:pointer;font-family:inherit}
.legal{max-width:760px;padding:64px 0 24px}
.legal h1{font-size:clamp(36px,4.4vw,52px)}
.legal h2{font-size:24px;margin:36px 0 10px}
.legal p{color:var(--ink);margin:0 0 12px;line-height:1.7}
.legal-nav{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 8px}
.legal-nav .flink{color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px}
.legal-nav .flink.on{border-color:var(--gold);background:var(--gold-soft)}

/* destinations */
.dest{border:0;padding:0;margin:0;min-width:0}
.dest legend{font-size:14px;font-weight:700;margin-bottom:10px;padding:0}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{position:relative;cursor:pointer}
.pill input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pill span{display:inline-flex;align-items:center;min-height:44px;padding:8px 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:15px}
.pill input:checked + span{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.pill input:focus-visible + span{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dest input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:var(--surface);font-size:16px;min-height:50px}
.hero p.dests{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;font-size:14px;max-width:none}
.hero p.dests span{border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));border-radius:999px;padding:4px 12px;color:var(--ink)}
.hero p.dests span.more-d{border-style:dashed;color:var(--muted)}

/* clothing rental */
.kit{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:8px}
.kit li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.kit li svg{margin-top:4px;color:var(--gold)}
.rent-price{font-size:17px;color:var(--ink)!important;margin:0 0 22px!important}
.rent-price b{font-family:var(--serif);font-size:24px;font-weight:600}
.split .small-note{font-size:14px;margin:16px 0 0!important}
.extras{margin-top:36px}
.extras h2{font-size:26px;margin-bottom:6px}
.extras > p{color:var(--muted);font-size:15px}

/* tray */
.tray{position:sticky;top:100px}
.tray .card{padding:24px;display:flex;flex-direction:column;gap:14px}
.tray h2{font-size:24px}
.tray .when{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--bg);border-radius:12px;padding:12px 14px}
.tray ul{list-style:none;margin:0;padding:0}
.tray li{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tray li .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tray li b{display:block;font-size:16px;line-height:1.3}
.tray li small{color:var(--muted);font-size:13px}
.tray li label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.tray li label.privtick input{width:16px;height:16px;margin:0;accent-color:var(--ink)}
.tray li select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-size:14px}
.x{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.note{font-size:13px;color:var(--muted);line-height:1.5}
@media (max-width:1020px){.tray.desk{display:none}}

.mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);color:var(--panel-ink);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px}
.mbar small{color:var(--panel-muted);display:block;font-size:13px}
.mbar b{font-size:17px}
@media (max-width:1020px){.mbar.show{display:flex}}
.sheet{display:none;position:fixed;inset:0;z-index:40;background:rgba(5,15,22,.55);align-items:flex-end}
.sheet.open{display:flex}
.sheet .inner{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .tray{position:static}

.sent{max-width:880px;margin:0 auto;text-align:center;padding:72px 0 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.sent h1{font-size:clamp(34px,4.4vw,50px)}
.sent .next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;text-align:left;width:100%;margin-top:12px}
.sent .next div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:8px}
.sent .next h3{font-size:20px}
.sent .next p{color:var(--muted);font-size:15px}
.sent .sum{width:100%;text-align:left}
@media (max-width:760px){.sent .next{grid-template-columns:1fr}}
.demo{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 14px}

.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}.btn{transition:none}}
</style>

h Consumer Advisory Services and bring the matter to the Consumer Disputes Board (Kuluttajariitalautakunta)."]]]}, "cancellation": {"title": "Cancellation policy", "sections": [["Cancelling your booking", ["Cancellation terms depend on the activity and follow our partner’s own terms. They are stated for each activity in your plan, before you pay. Some activities are non-refundable once paid; others can be cancelled free of charge up to a set time before the start. If no terms are stated for an activity, it is non-refundable once paid.", "Because the activities are booked for a specific date, the 14-day right of withdrawal doesn’t apply."]], ["If an activity is cancelled by us or our partner", ["If our partner cancels an activity, for example because of weather, lack of snow, safety or too few participants, you get a full refund for that activity. If you prefer, we can try to find you another time or a similar activity instead."]], ["Things that don’t lead to a refund", ["Not seeing the northern lights.", "Missing the pickup or start time.", "Not meeting an activity’s requirements, such as age or driving licence.", "Changes to the route or length of an activity made by the guide for safety or weather reasons."]], ["How to cancel", ["Email us at laplandtravelassistant@gmail.com. Even if no refund applies, please let us know so the partner can offer your place to someone else."]]]}, "privacy": {"title": "Privacy policy", "sections": [["Controller", ["Lapland Travel Assistant Oy, Business ID 3461722-8, Rovaniemi, Finland. Contact: laplandtravelassistant@gmail.com, +358 45 248 9250."]], ["What we collect", ["When you send a trip request or book with us, we collect: your name, email address and phone number; your travel dates, where you’re staying and the number of adults and children; children’s ages; the activities you’re interested in; and anything you choose to tell us in your message, such as dietary needs or mobility.", "Please only share health-related details if they’re needed to plan your activities safely."]], ["Why we use it", ["To plan your trip, check availability, send you your plan and confirmation, take payment and look after your booking. The legal basis is taking steps at your request before a contract, and carrying out that contract.", "We don’t use your details for marketing unless you’ve agreed to it."]], ["Who we share it with", ["Our partner companies that run your activities receive the details they need to deliver them, such as names, group size, children’s ages and pickup location.", "We also use trusted service providers for email, file storage, our website and payments. They only process data on our behalf. Some of them may process data outside the EU, in which case they use approved safeguards such as the EU standard contractual clauses."]], ["How long we keep it", ["We keep trip requests that don’t lead to a booking for 12 months. Booking and payment records are kept for as long as Finnish accounting law requires."]], ["Your rights", ["You can ask to see the data we hold about you, have it corrected or deleted, restrict or object to its use, or receive a copy of it. Email us at laplandtravelassistant@gmail.com.", "You also have the right to lodge a complaint with the Finnish Data Protection Ombudsman (tietosuoja.fi)."]]]}, "cookies": {"title": "Cookies", "sections": [["What we use", ["Our website doesn’t use advertising or tracking cookies.", "The trip builder saves your selections (dates, group size and chosen activities) in your own browser’s local storage, so they’re still there if you reload the page. This stays on your device and isn’t sent to us until you send your trip request. You can clear it anytime by clearing your browser’s site data."]], ["Changes", ["If we add analytics or other cookies in the future, we’ll update this page and ask for your consent where required."]]]}};

function d(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }

  return S.adults+' adult'+(S.adults==1?'':'s')+(k? ', '+k+' child'+(k==1?'':'ren')+(S.kids.every(function(x){return x!=='';})?' ('+S.kids.join(', ')+')':''):'')+(n? ', '+n+' infant'+(n==1?'':'s'):''); }
function days(){ var a=d(S.arr), b=d(S.dep), out=[]; if(!a||!b) return out; for(var t=new Date(a); t<=b && out.length<31; t.setDate(t.getDate()+1)){ out.push(new Date(t)); } return out; }
function festiveOn(){
  return days().some(function(x){ var m=x.getMonth()+1, dd=x.getDate();
    var afterStart = (m>FESTIVE.from[0]) || (m===FESTIVE.from[0] && dd>=FESTIVE.from[1]);
    var beforeEnd = (m<FESTIVE.to[0]) || (m===FESTIVE.to[0] && dd<=FESTIVE.to[1]);
    return afterStart || beforeEnd; });
}
function inMD(x,from,to){ var m=x.getMonth()+1, dd=x.getDate(), v=m*100+dd, f=from[0]*100+from[1], t=to[0]*100+to[1];
  return f<=t ? (v>=f && v<=t) : (v>=f || v<=t); }
function periodsFor(a){ if(!a.periods) return null; return a.periods.filter(function(p){ return days().some(function(x){ return inMD(x,p.from,p.to); }); }); }

// Returns {amount:number|null, note:string, warn:[]}
function estimate(id){
  var a=ALL[id], out={amount:null, note:'', warn:[]};
  if(!a) return out;
  if(a.cat==='extras'){ var n=rentalDays(), ppl=S.adults+S.kids.length;
    if(!n){ out.note='From €'+a.tiers[0].price+' per person'; return out; }
    out.amount=rentalPrice(n)*ppl; out.note=n+' days';
    if(S.infants) out.warn.push('Infant sizes confirmed in your plan');
    return out; }
  if(a.cat==='packages'){ out.note='Priced in your plan'; return out; }
  if(S.priv[id] && canPrivate(a)){ out.note='Private rate in your plan'; return out; }
  var q=periodFor(a,id); if(!q){ out.note='Price on request'; return out; }
  var mn=minAge(a), cr=ageRange(q.childAges), people=S.adults+S.kids.length+S.infants;
  if(q.group){ var groups=Math.ceil(people/8)||1; out.amount=q.group*groups; if(groups>1) out.warn.push('Priced as '+groups+' groups of up to 8'); }
  else {
    var sum=S.adults*q.adult;
    S.kids.forEach(function(age){
      age=+age;
      if(!age && age!==0){ age=cr?cr[0]:mn; }
      if(mn && age<mn){ out.warn.push('Not suitable for a child aged '+age+' (ages '+a.ages+')'); return; }
      if(cr && q.child && age>=cr[0] && age<=cr[1]) sum+=q.child; else sum+=q.adult;
      if(!cr && q.child && out.warn.indexOf('Child prices confirmed in your plan')<0) out.warn.push('Child prices confirmed in your plan');
    });
    if(S.infants){
      if(mn>3) out.warn.push('Not suitable for infants (ages '+a.ages+')');
      else if(q.infant && /free/i.test(q.infant)) {}
      else { out.warn.push('Infant price to be confirmed'); }
    }
    out.amount=sum;
    if(q.adultNote && S.adults%2===1) out.warn.push('Odd number of adults: one may share with another guest or drive alone');
  }
  return out;
}

function tripRequest(f){

    activities:items, estimatedTotal:wm?'':money(tot.t)+(tot.open?' + '+tot.open+' item(s) priced in the plan':''), wishes:wm?S.wish:null, message:f.note};
  var L=['TRIP REQUEST FROM THE WEBSITE','',

  if(wm){ var w=S.wish||{}; L.push('Interested in: '+((w.interests||[]).join(', ')||'–'), 'In mind: '+(w.text||'–'), 'Wants recommendations: '+(w.recommend?'Yes':'No')); }
  else { L.push('ACTIVITIES ('+items.length+')'); items.forEach(function(x){ L.push('- '+x.name+' ('+x.category+')'+(x.private?' – PRIVATE REQUESTED':''), '  Preferred day: '+x.preferredDay+' · Est. '+x.estimate+(x.notes?'\n  '+x.notes:'')); }); L.push('', 'Estimated total: '+data.estimatedTotal); }
  L.push('', 'Message:', f.note||'–');

function sendRequest(kind, data, text, subject, btn, er, done){
  var hp=document.getElementById('hp-'+kind);
  if(hp && hp.value){ done(); return; }
  var to = CONTACT.email;
  var mail='mailto:'+to+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text.length>1800?text.slice(0,1800)+'\n…':text);
  var label=btn?btn.textContent:'';
  function fail(){ if(btn){ btn.classList.remove('busy'); btn.disabled=false; btn.textContent=label; }
    er.innerHTML='Sorry, your request didn’t go through. Please try again, or <a href="'+esc(mail)+'">send it to us by email</a> instead.'; }
  if(!FORM_ENDPOINT){ fail(); return; }
  if(btn){ btn.classList.add('busy'); btn.disabled=true; btn.textContent='Sending…'; }
  er.textContent='';
  var ctl=window.AbortController?new AbortController():null, timer=setTimeout(function(){ if(ctl) ctl.abort(); },25000);
  // Sent as plain text so the browser doesn't need a CORS preflight (Apps Script can't answer one)
  fetch(FORM_ENDPOINT,{method:'POST', body:JSON.stringify({kind:kind, subject:subject, text:text, data:data, replyTo:data.email, page:location.href}), signal:ctl?ctl.signal:undefined})
    .then(function(r){ return r.json(); })
    .then(function(j){ clearTimeout(timer); if(j && j.ok){ done(); } else fail(); })
    .catch(function(){ clearTimeout(timer); fail(); });
}

function viewAbout(){
  setTop('site');
  app.innerHTML='<div class="wrap enter"><article class="legal about-page"><span class="eyebrow">'+'<svg width="12" height="12" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 Q20 20 40 20 Q20 20 20 40 Q20 20 0 20 Q20 20 20 0 Z" fill="currentColor"/></svg>'+'About us</span><h1>Who we are</h1>'+
   '<div class="about-text"><p>We’re local travel designers and guides with broad experience in Lapland tourism.</p><p>For many people, Lapland is a once-in-a-lifetime trip, and it should feel like one. Planning it yourself is harder than it looks: two activities booked for the same evening, a provider that doesn’t live up to the photos, a day that’s too full or too empty. Having someone plan it all for you has usually been seen as a luxury, so most people end up doing it alone.</p><p>We started Lapland Travel Assistant to change that. We handpick the experiences and the companies behind them. You tell us what kind of trip you’d like, and we tailor the schedule: what to do, with whom, in what order and at what time, so everything runs smoothly. All without pushing the price sky-high.</p><p>Tourism in Lapland is growing fast, and that comes with responsibility. We look for partners who keep groups small, treat their animals well and respect the nature they work in, so the Lapland you experience today is still here for the guests who come after you.</p></div>'+
   '<h2>What you can expect</h2>'+
   '<ul class="kit about-kit"><li>'+ico('check',18)+'<span><b>Handpicked partners.</b> We work with local companies we know and trust, and we only recommend what we’d book ourselves.</span></li>'+
   '<li>'+ico('check',18)+'<span><b>A schedule that fits.</b> No clashing times, no rushing between activities, and the right things on the right days.</span></li>'+
   '<li>'+ico('check',18)+'<span><b>One contact for everything.</b> You deal with us from the first question to the last booking.</span></li></ul>'+
   '<h2>The team</h2>'+
   '<div class="team">'+
       '<article class="person"><img src="images/team-saku.webp" alt="Saku, Chief Experience Officer" loading="lazy" width="112" height="112"><div><h3>Saku</h3><p class="role">Chief Experience Officer</p><p class="bio">A year in Lapland travel and a Master-rank League of Legends player. At home he leads a team of his own: a wife, three kids and three dogs, so no family trip is too complicated for him.</p></div></article>'+
     '</div>'+
   '<div class="row-actions" style="justify-content:flex-start"><a class="btn" href="#/plan">Start building your trip</a><a class="btn ghost" href="mailto:'+CONTACT.email+'">Email us</a></div>'+
  '</article></div>'+footerHTML();
  hideTray();
}
function viewAsk(sent){
  setTop('site'); var A=S.ask||{};
  app.innerHTML='<div class="wrap builder enter" style="max-width:720px">'+
   '<div class="b-title"><span class="eyebrow">'+'<svg width="12" height="12" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 Q20 20 40 20 Q20 20 20 40 Q20 20 0 20 Q20 20 20 0 Z" fill="currentColor"/></svg>'+'Ask a question</span><h1>'+(sent?'Thanks, we’ll be in touch.':'Ask us anything')+'</h1><p>'+(sent?'We’ll reply to '+esc(A.em||'your email')+' within 24 hours.':'Not ready to plan yet? Ask us anything about Lapland, our activities or how we work. We reply within 24 hours.')+'</p></div>'+
   (sent?'<div class="row-actions" style="justify-content:flex-start"><a class="btn" href="#/plan">Start building your trip</a><a class="btn ghost" href="#/">Back to the homepage</a></div>':
   '<form class="card" id="fa" style="margin-top:28px" novalidate><div class="fields">'+HP('question')+
    '<div class="field"><label for="afn">Name</label><input id="afn" autocomplete="name" value="'+esc(A.fn||'')+'"></div>'+
    '<div class="field"><label for="aem">Email</label><input id="aem" type="email" autocomplete="email" value="'+esc(A.em||'')+'"></div>'+
    '<div class="field full"><label for="aq">Your question</label><textarea id="aq">'+esc(A.q||'')+'</textarea></div>'+
    '<label class="check full"><input type="checkbox" id="agdpr"><span>I agree that my details are used to answer my question, as described in our <a href="#/privacy" target="_blank" rel="noopener">privacy policy</a></span></label>'+
   '</div><p class="err" id="ea" role="alert"></p><div class="row-actions"><span class="note">Or email <a href="mailto:'+CONTACT.email+'">'+CONTACT.email+'</a></span><button class="btn" type="submit">Send my question</button></div></form>')+
   '</div>'+footerHTML();
  hideTray();
  var f=$('#fa'); if(f) f.addEventListener('submit',function(e){
    e.preventDefault(); var er=$('#ea'); var v={fn:$('#afn').value.trim(), em:$('#aem').value.trim(), q:$('#aq').value.trim()}; S.ask=v; save();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.em)){ er.textContent='Add an email address we can reply to.'; return; }
    if(!v.q){ er.textContent='Write your question.'; return; }
    if(!$('#agdpr').checked){ er.textContent='Tick the box so we can use your details to reply.'; return; }
    var subject='Question from '+(v.fn||v.em), text='QUESTION FROM THE WEBSITE\n\nName: '+(v.fn||'–')+'\nEmail: '+v.em+'\n\n'+v.q+'\n';
    sendRequest('question', {name:v.fn, email:v.em, question:v.q}, text, subject, e.submitter||$('#fa button[type=submit]'), er, function(){ go('/ask/sent'); });
  });
}
function viewLegal(k){

  setTop('site');
  var body=L.sections.map(function(sec){ return '<h2>'+esc(sec[0])+'</h2>'+sec[1].map(function(t){ return '<p>'+esc(t)+'</p>'; }).join(''); }).join('');
  var nav=['terms','cancellation','privacy','cookies'].map(function(x){ return '<button type="button" class="flink'+(x===k?' on':'')+'" data-go="/'+x+'">'+esc(LEGAL[x].title)+'</button>'; }).join('');
  app.innerHTML='<div class="wrap enter"><article class="legal"><span class="eyebrow">Good to know</span><h1>'+esc(L.title)+'</h1><nav class="legal-nav" aria-label="Policies">'+nav+'</nav>'+body+'</article></div>'+footerHTML();
  hideTray();
}

function kidAgesHTML(){
  if(!S.kids.length) return '';
  var opts=function(v){ var o='<option value="">Age</option>'; for(var i=4;i<=MAXCHILD;i++) o+='<option value="'+i+'"'+(String(v)===String(i)?' selected':'')+'>'+i+'</option>'; return o; };
  return '<span style="font-size:14px;font-weight:700">Children’s ages</span><div class="ages">'+S.kids.map(function(v,i){ return '<label>Child '+(i+1)+' <select data-kid="'+i+'">'+opts(v)+'</select></label>'; }).join('')+'</div><span class="hint">Prices and age limits vary by activity, so this helps us show the right prices. Aged '+(MAXCHILD+1)+' or over? Add them as an adult.</span>';
}
function viewDates(){
  setTop('builder',0);
  app.innerHTML='<div class="wrap builder enter" style="max-width:820px">'+
   '<div class="b-title"><h1>When are you visiting Rovaniemi?</h1><p>We’ll only show experiences that run while you’re here.</p></div>'+
   '<form class="card" id="f1" style="margin-top:28px" novalidate><div class="fields">'+
    '<div class="field"><label for="arr">Arrival</label><input id="arr" type="date" value="'+esc(S.arr)+'" required></div>'+
    '<div class="field"><label for="dep">Departure</label><input id="dep" type="date" value="'+esc(S.dep)+'" required></div>'+
    '<div class="field"><span style="font-size:14px;font-weight:700" id="adl">Adults <span style="font-weight:400;color:var(--muted)">('+(MAXCHILD+1)+'+)</span></span><div class="stepper" role="group" aria-labelledby="adl"><button type="button" data-step="adults:-1" aria-label="One fewer adult">−</button><output id="adults" aria-live="polite">'+S.adults+'</output><button type="button" data-step="adults:1" aria-label="One more adult">+</button></div></div>'+
    '<div class="field"><span style="font-size:14px;font-weight:700" id="chl">Children <span style="font-weight:400;color:var(--muted)">(4–'+MAXCHILD+')</span></span><div class="stepper" role="group" aria-labelledby="chl"><button type="button" data-step="children:-1" aria-label="One fewer child">−</button><output id="children" aria-live="polite">'+S.kids.length+'</output><button type="button" data-step="children:1" aria-label="One more child">+</button></div></div>'+
    '<div class="field"><span style="font-size:14px;font-weight:700" id="inl">Infants <span style="font-weight:400;color:var(--muted)">(0–3)</span></span><div class="stepper" role="group" aria-labelledby="inl"><button type="button" data-step="infants:-1" aria-label="One fewer infant">−</button><output id="infants" aria-live="polite">'+S.infants+'</output><button type="button" data-step="infants:1" aria-label="One more infant">+</button></div></div>'+
    '<div class="field full" id="kidAges">'+kidAgesHTML()+'</div>'+
    '<div class="field full"><label for="hotel">Where are you staying? <span style="font-weight:400;color:var(--muted)">(optional)</span></label><input id="hotel" type="text" placeholder="Hotel, cabin or area" value="'+esc(S.hotel)+'"></div>'+
   '</div><p class="err" id="e1" role="alert"></p>'+
   '<div class="row-actions"><button type="button" class="link" data-go="/">'+ico('left',16)+'Back</button><button class="btn" type="submit">Continue</button></div></form></div>';
  hideTray();
  $('#arr').min=$('#dep').min=todayISO();
  $('#f1').addEventListener('submit',function(e){
    e.preventDefault();
    var a=$('#arr').value, b=$('#dep').value, er=$('#e1');
    if(!a||!b){ er.textContent='Add both your arrival and departure dates.'; return; }
    if(d(b)<d(a)){ er.textContent='Your departure date is before your arrival. Check the dates.'; return; }
    if(a<todayISO()){ er.textContent='Your arrival date is in the past. Check the dates.'; return; }
    if(S.kids.some(function(x){return x==='';})){ er.textContent='Add each child’s age.'; return; }
    S.dest='rovaniemi'; S.destOther=''; S.arr=a; S.dep=b; S.hotel=$('#hotel').value.trim(); save(); go('/plan/activities');
  });
}

function trayHTML(){
  var list = S.items.length ? '<ul>'+S.items.map(function(id){ var a=ALL[id]; if(!a) return '';
      var opts='<option value="">Any day</option>'+days().map(function(x){ var v=isoLocal(x); return '<option value="'+v+'"'+(S.pref[id]===v?' selected':'')+'>'+fmt(x,{weekday:'short',day:'numeric',month:'short'})+'</option>'; }).join('');
      var e=estimate(id);
      return '<li><div class="h"><div><b>'+esc(a.name)+'</b><small>'+esc(a.catName)+'</small></div><button type="button" class="x" data-remove="'+id+'" aria-label="Remove '+esc(a.name)+'">'+ico('x',14)+'</button></div>'+
        '<div class="est"><span>'+(e.amount!==null?'Est. <b>'+money(e.amount)+'</b>':esc(e.note))+'</span></div>'+
        e.warn.map(function(w){ return '<small class="warn">'+esc(w)+'</small>'; }).join('')+
        (S.pkgNote[id]?'<small>Your note: '+esc(S.pkgNote[id])+'</small>':'')+
        (a.cat==='packages'||a.cat==='extras'?'':'<label>'+'Preferred day'+' <select data-pref="'+id+'">'+opts+'</select></label>')+
        (canPrivate(a)?'<label class="privtick"><input type="checkbox" data-priv="'+id+'"'+(S.priv[id]?' checked':'')+'>Ask for it as a private experience</label>':'')+'</li>'; }).join('')+'</ul>'
    : '<div class="empty">Nothing added yet. Open a category and add the experiences you’d like.</div>';
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Your trip</h2><span class="note" style="font-size:14px">'+S.items.length+' selected</span></div>'+
    '<div class="when">'+ico('cal',18)+'<span>'+tripLine()+'</span></div>'+list+totalHTML()+
    '<button type="button" class="btn" data-go="/plan/details"'+(S.items.length?'':' disabled')+'>Continue to your details</button>'+
    '<p class="note">No payment now. We check availability and send you a plan with prices.</p></div>';
}
function totalHTML(){
  if(!S.items.length) return '';
  var e=totalEstimate();
  return '<div class="total"><div><span>Estimated total</span><b>'+money(e.t)+'</b></div><small>For '+guests()+'.'+(e.open?' Plus '+e.open+' item'+(e.open>1?'s':'')+' priced in your plan.':'')+' Final prices come with your plan.</small></div>';
}
function renderTray(){
  var t=$('#tray'); if(t) t.innerHTML=trayHTML();
  var si=$('#sheetInner'); if($('#sheet').classList.contains('open')) si.innerHTML='<div class="tray">'+trayHTML()+'</div><button type="button" class="btn ghost" style="width:100%;margin-top:12px" data-close>Keep browsing</button>';
  var tt=totalEstimate();
  var m=$('#mbar'); m.innerHTML='<div><small>'+S.items.length+' selected'+(S.items.length?' · est.':'')+'</small><b>'+(S.items.length?money(tt.t):'Your trip')+'</b></div><div style="display:flex;gap:10px"><button type="button" class="btn small ghost" style="color:#fff;border-color:#fff" data-open>View</button><button type="button" class="btn small gold" data-go="/plan/details"'+(S.items.length?'':' disabled')+'>Continue</button></div>';
  m.classList.add('show');
}
function hideTray(){ $('#mbar').classList.remove('show'); $('#sheet').classList.remove('open'); }
function needDates(){ if(!S.dest||!S.arr||!S.dep){ go('/plan'); return true; } return false; }

function elevatedMark(size){ return '<span class="elev-mark'+(size?' '+size:'')+'">'+'<svg width="12" height="12" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 Q20 20 40 20 Q20 20 20 40 Q20 20 0 20 Q20 20 20 0 Z" fill="currentColor"/></svg>'+'<span class="em-l">LAPLAND</span><span class="em-t">TRAVEL ASSISTANT</span><span class="em-e">ELEVATED</span></span>'; }
function packagesHTML(home){
  var list=home?PACKAGES:PACKAGES.filter(function(k){ return k.dest===S.dest; }); if(!list.length) return '';
  return '<section class="pkgs"><span class="eyebrow">'+'<svg width="12" height="12" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 Q20 20 40 20 Q20 20 20 40 Q20 20 0 20 Q20 20 20 0 Z" fill="currentColor"/></svg>'+'Ready-made packages</span><h2>Start from a package</h2><p>Three ways to see Lapland, each planned around the best days and times. Pick one and tell us if you’d like to change anything.'+(home?' Packages are currently available in Rovaniemi.':'')+'</p><div class="pkg-grid'+(home?' four':'')+'">'+
   list.map(function(k,i){ var on=has(k.id);
     if(k.elevated) return '<div class="pkg elevated">'+elevatedMark('sm')+'<h3>'+esc(k.name)+'</h3><p>'+esc(k.d)+'</p><div class="pkg-btns"><button type="button" class="btn small gold" data-go="/private">Plan your Elevated trip</button></div></div>';
     return '<div class="pkg'+(on?' added':'')+'"><span class="tier">'+(i+1)+' · '+esc(k.tier)+'</span><h3>'+esc(k.name)+'</h3><p>'+esc(k.d)+'</p><p class="pkg-price">From <b>€[PRICE]</b> per person</p><div class="pkg-btns"><button type="button" class="btn small ghost" data-book="'+k.id+'">Browse the package</button>'+
       (on?'<button type="button" class="btn small ghost" data-toggle="'+k.id+'" aria-pressed="true">'+ico('check',16)+'Chosen</button>':'<button type="button" class="btn small" data-choose="'+k.id+'">Choose</button>')+'</div></div>'; }).join('')+
   '</div></section>';
}

  var lines=function(c){ var h=''; for(var i=0;i<c;i++) h+='<i style="width:'+(60+((i*37)%38))+'%"></i>'; return '<div class="fb-lines">'+h+'</div>'; };
  var photo=function(t){ return '<div class="fb-photo"><span>'+t+'</span></div>'; };

var FB={k:null, leaf:0, n:0};
function openFlipbook(id){
  var k=ALL[id]; FB.k=k; FB.leaf=0;

  [1,2,3,4].forEach(function(dn,i){ pages.push(fbPage('day',k,{day:dn,p:3+i})); });
  pages.push(fbPage('incl',k,7)); pages.push(fbPage('price',k,8)); pages.push(fbPage('back',k,9));
  var leaves=[]; for(var i=0;i<pages.length;i+=2) leaves.push([pages[i],pages[i+1]||'']);
  FB.n=leaves.length;
  var html='<div class="fb-top"><span class="eyebrow" style="margin:0">'+esc(k.tier)+' package</span><button type="button" class="x" data-flip-close aria-label="Close">'+ico('x',14)+'</button></div>'+

    '</div></div>'+

function fbUpdate(){
  var book=$('#book'); if(!book) return;
  Array.prototype.forEach.call(book.querySelectorAll('.leaf'),function(l,i){
    var fl=i<FB.leaf; l.classList.toggle('flipped',fl); l.style.zIndex= fl ? i+1 : FB.n-i + (i===FB.leaf?FB.n:0);
  });
  book.classList.toggle('closed-front',FB.leaf===0); book.classList.toggle('closed-back',FB.leaf===FB.n);
  var c=$('#fbCount'); if(c) c.textContent = FB.leaf===0?'Cover':(FB.leaf===FB.n?'Back cover':'Pages '+(FB.leaf*2-1)+'–'+(FB.leaf*2));
}

function route(){
  var h=(location.hash||'#/').slice(1)||'/';
  if(h==='/') viewHome();
  else if(h==='/plan') viewDates();
  else if(h==='/plan/activities') viewCats();
  else if(h.indexOf('/plan/c/')===0) viewCat(h.slice(8));
  else if(h==='/plan/details') viewDetails();
  else if(h==='/plan/sent') viewSent();
  else if(h==='/about') viewAbout();
  else if(h==='/packages'){ if(SHOW_PACKAGES) viewPackages(); else viewHome(); }
  else if(h==='/ask') viewAsk(false);
  else if(h==='/ask/sent') viewAsk(true);
  else if(LEGAL[h.slice(1)]) viewLegal(h.slice(1));
  else viewHome();
  window.scrollTo(0,0);
  var h1=app.querySelector('h1'); if(h1){ h1.setAttribute('tabindex','-1'); h1.focus({preventScroll:true}); }
}

  if(pk){
    if(pk.dataset.book){ var k=ALL[pk.dataset.book]; openModal('<button type="button" class="x modal-x" data-close-modal aria-label="Close">'+ico('x',14)+'</button><span class="eyebrow">'+esc(k.tier)+' package</span><h2>'+esc(k.name)+'</h2><div class="flip-ph">'+'<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 0 Q20 20 40 20 Q20 20 20 40 Q20 20 0 20 Q20 20 20 0 Z" fill="#C9A24A"/></svg>'+'<b>Day-by-day package coming soon</b><span>You’ll be able to page through this package here like a small brochure.</span></div><div class="row-actions"><button type="button" class="btn ghost" data-close-modal>Close</button><button type="button" class="btn" data-choose="'+k.id+'">Choose this package</button></div>'); }
    else if(pk.dataset.choose){ var k2=ALL[pk.dataset.choose]; openModal('<button type="button" class="x modal-x" data-close-modal aria-label="Close">'+ico('x',14)+'</button><span class="eyebrow">'+esc(k2.tier)+' package</span><h2>Would you like to adjust or change anything?</h2><p style="color:var(--muted);margin-top:8px">Add, swap or skip anything in '+esc(k2.name)+'. Leave it empty if it’s perfect as it is.</p><div class="field" style="margin-top:18px"><label for="pkgNote">Your changes <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="pkgNote" placeholder="For example: swap the snowmobile ride for huskies, or add a free day">'+esc(S.pkgNote[k2.id]||'')+'</textarea></div><div class="row-actions"><button type="button" class="btn ghost" data-close-modal>Cancel</button><button type="button" class="btn" data-confirm-pkg="'+k2.id+'">Add to my trip</button></div>'); }
    else if(pk.dataset.confirmPkg){ var id2=pk.dataset.confirmPkg; S.pkgNote[id2]=($('#pkgNote').value||'').trim(); if(!has(id2)) S.items.push(id2); if(!S.dest) S.dest=ALL[id2].dest; save(); closeModal(); var y3=window.scrollY, hh3=(location.hash||'').slice(1);
      if(hh3==='/packages'){ viewPackages(); window.scrollTo(0,y3); } else if(hh3==='/'||hh3===''){ viewHome(); window.scrollTo(0,y3); } else { viewCats(); window.scrollTo(0,y3); } }
    else if(pk.hasAttribute('data-close-modal')) closeModal();
    return;
  }
  var t=e.target.closest('[data-go],[data-scroll],[data-toggle],[data-remove],[data-step],[data-open],[data-close],[data-reset]');
  if(!t) { if(e.target.id==='sheet'){ $('#sheet').classList.remove('open'); } if(e.target.id==='modal') closeModal(); return; }
  if(t.hasAttribute('disabled')) return;
  if(t.dataset.go!==undefined){ $('#sheet').classList.remove('open'); go(t.dataset.go); }
  else if(t.dataset.scroll){ var sid=t.dataset.scroll, target=document.getElementById(sid);
    if(target) target.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    else { go('/'); setTimeout(function(){ var t2=document.getElementById(sid); if(t2) t2.scrollIntoView(); },60); } }
  else if(t.dataset.toggle){ var id=t.dataset.toggle; if(has(id)) S.items=S.items.filter(function(x){return x!==id;}); else S.items.push(id); save();
    var h=(location.hash||'').slice(1), y=window.scrollY, rr=null;
    if(h.indexOf('/plan/c/')===0) rr=function(){ viewCat(h.slice(8)); };
    else if(h==='/plan/activities') rr=viewCats;
    else if(h==='/'||h==='') rr=viewHome;
    if(rr){ rr(); window.scrollTo(0,y); var b=document.querySelector('[data-toggle="'+id+'"]'); if(b) b.focus({preventScroll:true}); } }
  else if(t.dataset.remove){ var r=t.dataset.remove; S.items=S.items.filter(function(x){return x!==r;}); delete S.pref[r]; delete S.priv[r]; delete S.pkgNote[r]; save();
    var hh=(location.hash||'').slice(1); var y2=window.scrollY; if(hh.indexOf('/plan/c/')===0) viewCat(hh.slice(8)); else if(hh==='/plan/activities') viewCats(); else renderTray(); window.scrollTo(0,y2); }
  else if(t.dataset.step){ var p=t.dataset.step.split(':'), k=p[0], dlt=+p[1];
    if(k==='children'){ var nk=S.kids.length+dlt; if(nk<0||nk>12) return; if(dlt>0) S.kids.push(''); else S.kids.pop(); $('#children').textContent=S.kids.length; var ka=$('#kidAges'); if(ka) ka.innerHTML=kidAgesHTML(); save(); }
    else { var n=S[k]+dlt; var min=k==='adults'?1:0; if(n<min||n>20) return; S[k]=n; $('#'+k).textContent=n; save(); } }
  else if(t.hasAttribute('data-open')){ $('#sheet').classList.add('open'); renderTray(); }
  else if(t.hasAttribute('data-close')){ $('#sheet').classList.remove('open'); }
  else if(t.hasAttribute('data-reset')){ S={dest:'rovaniemi',destOther:'',arr:'',dep:'',adults:2,kids:[],infants:0,hotel:'',items:[],pref:{},priv:{},pkgNote:{},form:{},wish:{text:'',interests:[],recommend:false}}; save(); go('/'); }
});
document.addEventListener('change',function(e){
  var pv=e.target.closest('[data-priv]'); if(pv){ if(pv.checked) S.priv[pv.dataset.priv]=true; else delete S.priv[pv.dataset.priv]; save(); renderTray(); return; }
  var s=e.target.closest('[data-pref]'); if(s){ S.pref[s.dataset.pref]=s.value; save(); renderTray(); return; }
  var kd=e.target.closest('[data-kid]'); if(kd){ S.kids[+kd.dataset.kid]=kd.value; save(); }
});
document.addEventListener('keydown',function(e){
  if($('#flip').classList.contains('open')){ if(e.key==='ArrowRight'){ fbGo(1); return; } if(e.key==='ArrowLeft'){ fbGo(-1); return; } if(e.key==='Escape'){ closeFlip(); return; } }
  if(e.key==='Escape'){ $('#sheet').classList.remove('open'); closeModal(); } });
// Scroll reveal for boxes below the fold
var RV_SEL='.cat,.cta-card,.how,.band,.person,.act,.split > .ph,.sent .next > div,.extras .act';
function reveal(){
  if(!('IntersectionObserver' in window)) return;
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  var vh=window.innerHeight||800;
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }); },{rootMargin:'0px 0px -6% 0px'});
  Array.prototype.forEach.call(app.querySelectorAll(RV_SEL),function(el){
    var r=el.getBoundingClientRect(); if(r.top<vh && r.bottom>0) return;
    el.classList.add('rv'); io.observe(el);
  });
}
new MutationObserver(function(){ requestAnimationFrame(reveal); }).observe(app,{childList:true});
route();
try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches){ document.addEventListener('play',function(e){ if(e.target.classList&&e.target.classList.contains('hero-video')) e.target.pause(); },true); } }catch(e){}
})();
</script>
